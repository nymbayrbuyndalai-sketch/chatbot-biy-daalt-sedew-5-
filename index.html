<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Алгоритмын чатбот</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f6; --panel: #ffffff; --ink: #1b2433; --muted: #5d6b82;
  --accent: #2f4bd8; --on-accent: #ffffff; --line: #d9dfeb; --chip: #e3e8f5;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --panel: #19202f; --ink: #e8ecf5; --muted: #98a4bb;
    --accent: #7c93ff; --on-accent: #0f1420; --line: #2a3347; --chip: #232c40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --panel: #19202f; --ink: #e8ecf5; --muted: #98a4bb;
  --accent: #7c93ff; --on-accent: #0f1420; --line: #2a3347; --chip: #232c40;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center;
}
header { width: 100%; max-width: 720px; box-sizing: border-box; padding: 16px 18px 8px; }
h1 { font-size: 1.25rem; font-weight: 800; margin: 0; }
header p { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }
#log {
  flex: 1; width: 100%; max-width: 720px; box-sizing: border-box; overflow-y: auto;
  padding: 10px 18px; display: flex; flex-direction: column; gap: 10px;
}
.msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; font-size: .95rem; overflow-wrap: anywhere; }
.bot { background: var(--panel); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
.user { background: var(--accent); color: var(--on-accent); align-self: flex-end; border-bottom-right-radius: 4px; }
.why { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: .75rem; color: var(--muted); }
#chips { width: 100%; max-width: 720px; box-sizing: border-box; padding: 4px 18px; display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--chip); color: var(--ink); border: 0; border-radius: 999px; padding: 7px 12px; font: inherit; font-size: .8rem; cursor: pointer; }
#bar { width: 100%; max-width: 720px; box-sizing: border-box; display: flex; gap: 8px; padding: 10px 18px 16px; }
#inp {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
#send { font: inherit; font-weight: 600; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer; }
#inp:focus-visible, #send:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Алгоритмын чатбот</h1>
  <p>Кирилл болон Латин үсгээр бичиж болно. Бот хариултаа хэрхэн сонгосныг доороос нь хараарай.</p>
</header>
<div id="log" aria-live="polite"></div>
<div id="chips"></div>
<div id="bar">
  <input id="inp" type="text" placeholder="Асуултаа бичнэ үү" autocomplete="off" aria-label="Асуулт">
  <button id="send" type="button">Илгээх</button>
</div>
<script>
// ---- Мэдлэгийн сан ----
// Кирилл үсгийг дуудлагын Латин хэлбэр рүү хөрвүүлэх хүснэгт
const CYR = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"ye","ё":"yo","ж":"j","з":"z","и":"i","й":"i","к":"k","л":"l","м":"m","н":"n","о":"o","ө":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ү":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"","ы":"i","ь":"","э":"e","ю":"yu","я":"ya"};

// Үгийг дуудлагын түлхүүр болгоно: Кирилл ба Латин бичлэг нэг түлхүүр өгнө.
// жишээ: юу, yu, yuu -> yu | вэ, we, ve -> ve | хэн, khen, hen -> hen
function key(word) {
  let s = "";
  for (const ch of word.toLowerCase()) s += (ch in CYR) ? CYR[ch] : ch;
  return s.replace(/kh/g, "h").replace(/zh/g, "j").replace(/w/g, "v")
          .replace(/q/g, "k").replace(/x/g, "h").replace(/[öü]/g, "u").replace(/c(?!h)/g, "k")
          .replace(/ye/g, "e").replace(/y(?![aeiou])/g, "i")
          .replace(/o/g, "u")
          .replace(/(.)\1+/g, "$1");
}

const STOPWORDS = new Set(["вэ", "бэ", "гэж", "минь"].map(key));
const THRESHOLD = 0.4;
const pad = n => String(n).padStart(2, "0");
const getTime = () => { const d = new Date(); return "Одоо " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + " цаг болж байна."; };
const getDate = () => { const d = new Date(); return "Өнөөдөр " + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "."; };

const KB = [
  [["сайн уу", "сайн байна уу", "мэнд"], "Сайн байна уу! Би танд яаж туслах вэ?"],
  [["чиний нэр хэн бэ", "чи хэн бэ", "чи юу вэ", "чи юу юм", "нэр чинь юу вэ"], "Би алгоритмын хичээлийн бие даалтад зориулсан энгийн чатбот."],
  [["чи юу хийж чадах вэ", "тусламж"], "Би энгийн асуултад хариулна. Цаг, огноо, алгоритмын үндсэн ойлголтуудыг асууж болно."],
  [["одоо хэдэн цаг вэ", "цаг хэд вэ"], getTime],
  [["өнөөдөр хэд вэ", "өнөөдрийн огноо", "огноо хэд вэ"], getDate],
  [["алгоритм гэж юу вэ"], "Алгоритм гэдэг нь бодлогыг шийдэх алхмуудын төгсгөлөг, тодорхой дараалал юм."],
  [["цагийн нарийн төвөгтэй байдал гэж юу вэ", "time complexity гэж юу вэ", "o(n) гэж юу вэ"], "Оролтын хэмжээ n өсөхөд алгоритмын гүйцэтгэх үйлдлийн тоо хэрхэн өсөхийг илэрхийлнэ."],
  [["бинар хайлт гэж юу вэ", "binary search гэж юу вэ"], "Эрэмблэгдсэн жагсаалтыг хагас хагасаар нь хувааж хайх арга. Нарийн төвөгтэй байдал нь O(log n)."],
  [["эрэмбэлэх алгоритм юу байдаг вэ", "sort алгоритмууд"], "Bubble sort, Selection sort, Insertion sort, Merge sort, Quick sort гэх мэт."],
  [["рекурс гэж юу вэ", "recursion гэж юу вэ"], "Функц өөрийгөө дуудаж бодлогыг жижиг дэд бодлогууд болгон шийддэг арга."],
  [["баяртай", "дараа уулзъя"], "Баяртай! Амжилт хүсье."]
];

// ---- Алгоритмууд ----
// 1. Tokenization + дуудлагын түлхүүр (Кирилл/Латин), O(n)
function tokenize(text) {
  const words = text.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
  return words.map(key).filter(w => !STOPWORDS.has(w));
}

// 2. Levenshtein зай, динамик программчлал, O(a*b)
function levenshtein(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const curr = [i];
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
    }
    prev = curr;
  }
  return prev[b.length];
}

function wordsMatch(a, b) {
  if (a === b) return true;
  if (Math.min(a.length, b.length) < 4) return false;
  return levenshtein(a, b) <= 1;
}

// 3. Fuzzy Jaccard: таарсан үг / нийт ялгаатай үг
function similarity(q1, q2) {
  if (!q1.length || !q2.length) return 0;
  const used = new Set();
  let matched = 0;
  for (const w1 of q1) {
    for (let i = 0; i < q2.length; i++) {
      if (!used.has(i) && wordsMatch(w1, q2[i])) { used.add(i); matched++; break; }
    }
  }
  return matched / (q1.length + q2.length - matched);
}

// 4. Шугаман хайлт, O(k): хамгийн өндөр оноотой асуултыг сонгоно
function getAnswer(text) {
  const tokens = tokenize(text);
  let best = { score: 0, answer: null, question: "" };
  for (const [questions, answer] of KB) {
    for (const q of questions) {
      const s = similarity(tokens, tokenize(q));
      if (s > best.score) best = { score: s, answer, question: q };
    }
  }
  if (best.answer === null || best.score < THRESHOLD) {
    return { text: "Уучлаарай, би энэ асуултыг ойлгосонгүй. Өөрөөр асууж үзнэ үү.", why: "Тохирох асуулт олдсонгүй, хамгийн өндөр оноо " + best.score.toFixed(2) + " нь босго " + THRESHOLD + "-оос бага." };
  }
  const text2 = typeof best.answer === "function" ? best.answer() : best.answer;
  const note = (/[a-z]/i.test(text) && /[а-яөү]/i.test(best.question)) ? ". Латин бичлэгийг дуудлагаар нь таньлаа" : "";
  return { text: text2, why: "Төстэй асуулт: «" + best.question + "», оноо " + best.score.toFixed(2) + note };
}

// ---- Интерфейс ----
const log = document.getElementById("log");
const inp = document.getElementById("inp");

function addMsg(kind, text, why) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  if (why) {
    const w = document.createElement("span");
    w.className = "why";
    w.textContent = why;
    el.appendChild(w);
  }
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function ask(text) {
  text = text.trim();
  if (!text) return;
  addMsg("user", text);
  const r = getAnswer(text);
  addMsg("bot", r.text, r.why);
  inp.value = "";
}

document.getElementById("send").addEventListener("click", () => ask(inp.value));
inp.addEventListener("keydown", e => { if (e.key === "Enter") ask(inp.value); });

["Сайн уу", "chi yu we", "Алгоритм гэж юу вэ", "Бинар хайлт гэж юу вэ", "Одоо хэдэн цаг вэ"].forEach(q => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = q;
  b.addEventListener("click", () => ask(q));
  document.getElementById("chips").appendChild(b);
});

addMsg("bot", "Сайн байна уу! Алгоритм, цаг, огноо зэргийг надаас асууж болно. Латин үсгээр бичсэн (жишээ нь chi yu we) асуултыг ч ойлгоно.");
</script>
</body>
</html>
